# Native builds (Windows x86_64, Linux x86_64) using the Castle Game Engine
# Docker image with FPC and cross-compilers, but no engine ("cge-none"):
# tools/ci_cge.sh gets Castle Game Engine and builds its build tool: the
# doom3-port branch of mariuz/castle-engine (CGE master with the pull requests
# this port needs merged in; CGE_REPO / CGE_BRANCH choose another engine).
#
# - On every push / pull request: parser unit tests, autotest screenshots of
#   the bundled test level, and packages kept as workflow artifacts.
# - On a tag like v0.1.0: also attach the packages to a GitHub Release.
#
# See https://castle-engine.io/github_actions and https://castle-engine.io/docker

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Package Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-none
    steps:
      - uses: actions/checkout@v4

      - name: Get Castle Game Engine (doom3-port branch)
        run: bash tools/ci_cge.sh

      - name: Show versions
        run: |
          castle-engine --version
          fpc -iV

      - name: Package Windows (x86_64)
        run: castle-engine package --os=win64 --cpu=x86_64 --mode=release --verbose

      - name: Package Linux (x86_64)
        run: castle-engine package --os=linux --cpu=x86_64 --mode=release --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom3-windows
          path: "*-win64-x86_64.zip"
          if-no-files-found: error

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: castle-doom3-linux
          path: "*-linux-x86_64.tar.gz"
          if-no-files-found: error

  autotest:
    name: Tests and autotest (Linux, Mesa software OpenGL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: kambi/castle-engine-cloud-builds-tools:cge-none
    steps:
      - uses: actions/checkout@v4

      - name: Get Castle Game Engine (doom3-port branch)
        run: bash tools/ci_cge.sh

      - name: Check the test PK4 is up to date with its generator
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          cp data/base/castle_doom3_test.pk4 /tmp/committed.pk4
          python3 tools/make_test_pk4.py
          cmp data/base/castle_doom3_test.pk4 /tmp/committed.pk4 || echo "::warning::test PK4 differs from tools/make_test_pk4.py output (zlib versions can differ); regenerate and commit it"

      - name: Install virtual display and Mesa
        run: |
          apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Parser unit tests
        working-directory: tests
        run: |
          castle-engine compile --os=linux --cpu=x86_64 --mode=debug
          ./castle-doom3-tests

      - name: Compile (Linux)
        run: castle-engine compile --os=linux --cpu=x86_64 --mode=release

      - name: Run autotest scripts
        run: |
          set -eu
          mkdir -p test_output
          run_test() {
            name="$1"; map="$2"; demo="$3"
            echo "::group::autotest $name"
            status=0
            timeout 600 xvfb-run -a -s "-screen 0 1600x900x24" ./castle-doom3 --autotest "$map" "test_output/$name" --demo "$demo" > "test_output/$name.log" 2>&1 || status=$?
            tail -n 40 "test_output/$name.log"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::autotest $name exited with $status"; exit 1
            fi
            if grep -q "shader not compiled" "test_output/$name.log"; then
              echo "::error::GLSL shader compile error in autotest $name"; exit 1
            fi
            if grep -q "Exception" "test_output/$name.log"; then
              echo "::error::Exception in autotest $name"; exit 1
            fi
          }
          run_test start testmap "W:2,S,T:-45,S,Q"
          run_test door testmap "W:1,G:200 0 0,A:0,W:2.2,S,G:420 -250 0,A:20,F,W:0.4,S,Q"
          run_test fight testmap "W:1,O:notarget,G:400 -100 0,N:0,W:0.3,Y,X,W:0.4,X,W:0.4,X,W:0.4,X,W:0.4,X,W:0.4,X,W:0.4,X,W:0.4,X,W:0.4,S,Q"
          run_test menu MENU "Q"
          run_test static testmap "W:1,G:740 -200 96,A:-45,W:0.5,S,G:-60 100 0,A:90,W:0.3,GO:1 0 1.5,S,Q"
          grep -q "11 static models" test_output/static.log || { echo "::error::static models (LWO / ASE) not loaded"; exit 1; }
          run_test clip testmap "W:1,G:-200 -100 0,A:90,W:0.3,GO:1 0 1.5,S,Q"
          grep -Eq "testmap.cm.: [0-9]+ models" test_output/clip.log || { echo "::error::collision model not loaded"; exit 1; }
          run_test portals testmap "W:1,S,G:200 0 0,A:0,W:2.2,S,A:180,W:0.2,S,Q"
          grep "Screenshot" test_output/portals.log | sed -n 1p | grep -q "visible areas 1" || { echo "::error::closed door should hide room B"; exit 1; }
          grep "Screenshot" test_output/portals.log | sed -n 2p | grep -q "visible areas 2" || { echo "::error::room B should be visible through the open door"; exit 1; }
          grep "Screenshot" test_output/portals.log | sed -n 3p | grep -q "visible areas 1" || { echo "::error::room B should be hidden behind the camera"; exit 1; }
          run_test shadows testmap "W:1,O:notarget,G:250 -40 0,A:-125,W:0.4,S,O:r_shadows 0,W:0.2,S,Q"
          grep "Screenshot" test_output/shadows.log | sed -n 1p | grep -q "shadows light_1" || { echo "::error::light_1 should cast the shadows"; exit 1; }
          grep "Screenshot" test_output/shadows.log | sed -n 2p | grep -q "shadows none" || { echo "::error::r_shadows 0 should turn shadows off"; exit 1; }
          run_test stages testmap "W:1,O:notarget,G:640 -150 0,A:90,P:45,W:0.4,S,G:740 -200 96,A:-45,W:0.3,S,W:1,S,Q"
          grep -q 'Sky "textures/test/sky"' test_output/stages.log || { echo "::error::the skybox should be set up"; exit 1; }
          cmp -s test_output/stages_2.png test_output/stages_3.png && { echo "::error::the terminal screen should scroll"; exit 1; } || true
          grep -q "Material stages: 1 overlays, 1 sprites, 2 glass surfaces" test_output/stages.log || { echo "::error::overlay stages, sprites and glass should be built"; exit 1; }
          grep -q "Special stages: 1 heat haze glass surfaces, 2 reflections" test_output/stages.log || { echo "::error::the heat haze pane and the cube map reflections should be built"; exit 1; }
          run_test guis testmap "W:1,O:notarget,G:-150 -60 0,A:180,P:10,W:0.4,S,G:385 200 0,A:90,P:22,W:0.4,S,Q"
          grep -q 'Rendered "guis/test_panel.gui" (5 windows)' test_output/guis.log || { echo "::error::the panel GUI should be rendered"; exit 1; }
          grep -q 'Rendered "guis/test_status.gui" (6 windows)' test_output/guis.log || { echo "::error::the status GUI should be rendered"; exit 1; }
          grep -q "Shadow casters: 20 brushes" test_output/shadows.log || { echo "::error::the .cm brushes should cast shadows"; exit 1; }
          grep -q 'Prelight shadow volume "_prelight_light_1": 20 triangles' test_output/shadows.log || { echo "::error::the precomputed shadow volume of light_1 should cast"; exit 1; }
          run_test hulls testmap "W:0.5,O:r_md5ShadowClosed 0,O:r_md5ShadowTris 0,W:1.5,O:notarget,G:470 -170 0,A:45,P:-20,W:0.5,S,Q"
          grep -q "casts with 6 joint boxes" test_output/hulls.log || { echo "::error::big md5 meshes should cast with joint boxes"; exit 1; }
          run_test closedcast testmap "W:0.5,O:r_md5ShadowTris 0,W:1.5,O:notarget,G:470 -170 0,A:45,P:-20,W:0.5,S,Q"
          grep -q 'Shadows: "models/md5/test/blob.md5mesh" has 72 triangles, closed: casts with its triangles' test_output/closedcast.log || { echo "::error::closed md5 meshes should cast with their own triangles"; exit 1; }
          run_test lights testmap "W:1,O:notarget,G:420 -60 0,A:0,W:0.6,O:lights,S,W:0.4,O:lights,W:0.7,O:lights,Q"
          test "$(grep 'Lights: light_4 ' test_output/lights.log | sort -u | wc -l)" -ge 2 || { echo "::error::the pulsing light should change color"; exit 1; }
          grep -q "Killed blob_1" test_output/fight.log || { echo "::error::the creature was not killed"; exit 1; }
          run_test triggers testmap "W:1,O:notarget,G:200 0 0,A:0,W:2,G:330 0 0,W:1.5,G:700 200 96,A:30,W:0.3,S,W:1.5,O:actors,Q"
          grep -q "Trigger trigger_once_1 fired" test_output/triggers.log || { echo "::error::walking into trigger_once_1 should fire it"; exit 1; }
          grep -q "Light light_trig on" test_output/triggers.log || { echo "::error::trigger_relay_1 should switch light_trig on"; exit 1; }
          grep -q "test_walker_1: state_Done" test_output/triggers.log || { echo "::error::the trigger should make test_walker_1 walk to its path_corner (AI script)"; exit 1; }
          grep -q "Script: testmap main" test_output/triggers.log || { echo "::error::the map script's main should run"; exit 1; }
          grep -q "test_trigger_called by trigger_once_1" test_output/triggers.log || { echo "::error::trigger_once_1's call key should run its script function"; exit 1; }
          grep -q "Spawned 3 movers.*1 bound entities" test_output/triggers.log || { echo "::error::door_1, door_2 and spinner_1 should be movers, door_light_1 bound"; exit 1; }
          run_test cinematic testmap "W:1,O:notarget,G:340 -340 0,A:90,W:1,S,W:3.5,S,Q"
          grep "Screenshot" test_output/cinematic.log | sed -n 1p | grep -q "cinematic test_cam_1" || { echo "::error::trigger_once_cin should start the camera test_cam_1"; exit 1; }
          grep -q 'Animated animated_blob_1 plays "walk"' test_output/cinematic.log || { echo "::error::the cinematic should start the idAnimated blob"; exit 1; }
          grep -q "md5 models (3 with heads)" test_output/cinematic.log || { echo "::error::the idAnimated blob, test_walker_1 and test_stepper_1 should get their def_head"; exit 1; }
          grep -q "Teleport to info_player_teleport_1" test_output/cinematic.log || { echo "::error::the camera's end should teleport the player"; exit 1; }
          grep "Screenshot" test_output/cinematic.log | sed -n 2p | grep -Eq "eye 500 (200|199.9)" || { echo "::error::the player should be at info_player_teleport_1 after the cinematic"; exit 1; }
          run_test monster testmap "W:1,O:god,G:740 300 96,A:0,W:4,O:actors,S,Q"
          run_test projectile testmap "W:1,O:god,G:560 300 0,A:0,W:3,S,Q"
          grep -q "Projectile of blob_scripted_1 hits the player" test_output/projectile.log || { echo "::error::the scripted monster's range anim should throw a projectile that hits the player"; exit 1; }
          run_test route testmap "W:1,O:god,G:760 300 96,A:0,W:1.5,G:-100 -200 0,A:45,W:18,O:aas blob_scripted_1,S,Q"
          grep -q "blob_scripted_1 in area 1" test_output/route.log || { echo "::error::blob_scripted_1 should follow the AAS route from the balcony through the doorway into room A"; exit 1; }
          run_test talk testmap "W:1,O:notarget,O:activate test_walker_1,W:6,G:-80 130 0,A:-90,W:0.3,U,W:1,S,W:2,Q"
          grep -q "Talking to test_walker_1" test_output/talk.log || { echo "::error::the use key in front of test_walker_1 should talk to it"; exit 1; }
          grep -q "blob_scripted_1 hits the player" test_output/monster.log || { echo "::error::the scripted monster should chase and hit the player (AI script, melee frame command)"; exit 1; }
          run_test ranged testmap "W:1,O:god,G:420 -250 0,A:30,O:activate blob_ranged_1,W:0.4,S,W:4,O:actors,Q"
          grep -q "Projectile of blob_ranged_1 hits the player" test_output/ranged.log || { echo "::error::blob_ranged_1's homing balls (create_missile / launch_missile, attackMissile) should hit the player"; exit 1; }
          run_test flyer testmap "W:1,O:god,G:420 -250 0,A:60,O:activate blob_flyer_1,W:1.5,S,W:4,O:actors,Q"
          grep -q "blob_flyer_1 hits the player (damage_test_charge, 9)" test_output/flyer.log || { echo "::error::the flying blob_flyer_1 should charge into the player (MOVETYPE_FLY, chargeAttack)"; exit 1; }
          run_test dodge testmap "W:1,O:god,G:420 -250 0,A:90,O:activate blob_dodger_1,W:6,S,O:actors,Q"
          grep -q "blob_dodger_1 at its combat node" test_output/dodge.log || { echo "::error::blob_dodger_1 should go to combat_node_1 (getCombatNode, the player in its cone)"; exit 1; }
          grep -q "blob_dodger_1 dodged" test_output/dodge.log || { echo "::error::blob_dodger_1 should dodge (testAnimMove, the evade anim moving it)"; exit 1; }
          run_test flyroute testmap "W:1,O:god,G:-100 -200 0,A:0,O:activate blob_flyer_1,W:20,O:actors,Q"
          awk '/blob_flyer_1: / { x = $0; sub(/.* at /, "", x); split(x, p, " "); last = p[1] } END { exit !(last != "" && last + 0 < 240) }' test_output/flyroute.log || { echo "::error::blob_flyer_1 should fly its AAS route through the doorway into room A"; exit 1; }
          run_test throw testmap "W:1,O:god,G:420 -250 0,A:90,O:activate blob_thrower_1,W:1,S,W:1,Q"
          grep -q "blob_thrower_1 throws moveable_barrel_1" test_output/throw.log || { echo "::error::blob_thrower_1 should choose the barrel to throw (chooseObjectToThrow)"; exit 1; }
          grep -q "moveable_barrel_1 hits the player" test_output/throw.log || { echo "::error::the thrown barrel should hit the player (idMoveable damage)"; exit 1; }
          run_test stepper testmap "W:1,O:notarget,G:-100 -200 0,A:0,O:activate test_stepper_1,W:2,O:actors,Q"
          grep -q "Script: test_stepper_1 stepped" test_output/stepper.log || { echo "::error::test_stepper_1 should play its evade_left anim"; exit 1; }
          awk '/test_stepper_1: / { x = $0; sub(/.* at /, "", x); split(x, p, " "); y = p[2] } END { exit !(y != "" && y + 0 > -40 && y + 0 < -32) }' test_output/stepper.log || { echo "::error::test_stepper_1 should move 64 left by its anim (characters move by their animations)"; exit 1; }
          run_test items testmap "W:1,O:notarget,G:-40 -210 0,W:0.2,G:0 -210 0,W:0.2,G:40 -210 0,W:0.2,G:-80 -210 0,W:0.2,G:80 -210 0,W:0.2,G:-140 -210 0,W:0.2,G:80 -210 0,W:0.2,O:inventory,Q"
          grep -q "Picked up item_armor_1" test_output/items.log || { echo "::error::touching an item should pick it up"; exit 1; }
          if grep -q "Picked up item_medkit_1" test_output/items.log; then echo "::error::the medkit should stay (full health)"; exit 1; fi
          grep -q "weapon_test_shotgun (clip 4)" test_output/items.log || { echo "::error::the shotgun pickup should give the weapon and its clip"; exit 1; }
          grep -q "Picked up item_armor_2" test_output/items.log || { echo "::error::the key's targets should let item_armor_2 (triggerFirst) be picked up"; exit 1; }
          grep -q "armor 50/100" test_output/items.log || { echo "::error::two armor pickups should give 50 armor"; exit 1; }
          run_test weapons testmap "W:1,O:notarget,G:420 -250 0,A:0,W:1,X,W:0.6,S,O:reload,W:1.5,O:weapon 0,W:1.5,X,W:0.6,O:give all,O:weapon 2,W:1.8,X,W:0.6,S,O:inventory,Q"
          grep -q "Weapon 1: weapon_test_pistol (script weapon_test_gun" test_output/weapons.log || { echo "::error::the pistol should run its weapon script"; exit 1; }
          grep -q "Weapon weapon_test_pistol fires 1 (clip 11" test_output/weapons.log || { echo "::error::the pistol should fire from its clip"; exit 1; }
          grep -q "Weapon 0: weapon_test_fists" test_output/weapons.log || { echo "::error::weapon 0 should switch to the fists"; exit 1; }
          grep -q "Weapon weapon_test_shotgun fires 8" test_output/weapons.log || { echo "::error::the shotgun should fire 8 pellets"; exit 1; }
          grep -q "1 weapon_test_pistol (clip 12)" test_output/weapons.log || { echo "::error::the pistol should have reloaded"; exit 1; }
          run_test fall testmap "W:1,O:notarget,G:420 -250 200,W:3,O:inventory,Q"
          grep -q "damage_softfall (10)" test_output/fall.log || { echo "::error::a fall of about 200 units should do soft falling damage"; exit 1; }
          grep -q "health 90/100" test_output/fall.log || { echo "::error::the soft fall should take 10 health"; exit 1; }
          run_test reverb testmap "W:1,O:notarget,O:reverb,G:420 -250 0,A:0,W:0.5,O:reverb,O:s_useEAXReverb 0,W:0.3,Q"
          grep -q "Found efxs/testmap.efx: 3 effects" test_output/reverb.log || { echo "::error::efxs/testmap.efx should be loaded"; exit 1; }
          grep -q 'Effect "room_a" (area 0, location "room_a")' test_output/reverb.log || { echo "::error::room A should get its reverb by location (info_location)"; exit 1; }
          grep -q 'Effect "1" (area 1, location "room_b")' test_output/reverb.log || { echo "::error::room B should get its reverb by area number"; exit 1; }
          grep -q "Off (s_useEAXReverb 0)" test_output/reverb.log || { echo "::error::s_useEAXReverb 0 should turn the reverb off"; exit 1; }
          ls -l test_output
          test "$(ls test_output/*.png | wc -l)" -ge 29

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots
          path: test_output/
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: List packages
        run: ls -l packages
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.zip
            packages/*.tar.gz
          generate_release_notes: true
